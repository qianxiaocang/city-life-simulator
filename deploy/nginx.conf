map $uri $city_life_cache {
    default "no-cache, must-revalidate";
    ~*\.(?:js|mjs|css|png|jpe?g|svg|webp|ico|woff2?)$ "public, max-age=3600";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $city_life_cache always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
